kind = "web"
previewPath = "/"
title = "Too Much Chips"
description = "A lively product landing page for Too Much Chips, snackers who want extra seasoning and more chips in every bag, with an engaging problem-first sales script."
version = "1.0.0"
id = "artifacts/too-much-chips"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23908

[services.development]
run = "pnpm --filter @workspace/too-much-chips run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/too-much-chips", "run", "build" ]
serve = "static"
publicDir = "artifacts/too-much-chips/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23908"
BASE_PATH = "/"
